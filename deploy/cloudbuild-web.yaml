# Builds the OneStack web image. ONESTACK_API_BASE must be the DEPLOYED API URL (next.config inlines it
# at build time), passed at submit time via --substitutions _API_BASE=...
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/web.Dockerfile
      - --build-arg
      - ONESTACK_API_BASE=${_API_BASE}
      - -t
      - australia-southeast1-docker.pkg.dev/procureos-499711/onestack/web:latest
      - .
images:
  - australia-southeast1-docker.pkg.dev/procureos-499711/onestack/web:latest
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
substitutions:
  # Default to the deployed API so a plain `gcloud builds submit` never bakes localhost into
  # the image (next.config inlines this at build time). Override with --substitutions _API_BASE=… for
  # other environments.
  _API_BASE: 'https://onestack-api-239611169150.australia-southeast1.run.app/api/v1'
