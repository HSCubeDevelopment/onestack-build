# Fly.io — OneStack API + background workers. Sydney region (AU data residency).
# Real deploy is activated in the card #1 hand-off (create the app + set FLY_API_TOKEN).
app = "onestack-api-staging"
primary_region = "syd"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

# Workers + the transactional-outbox relay run HERE (never on Vercel serverless).
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
