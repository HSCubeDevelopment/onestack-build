name: CI

# The gate: runs on every PR and every push to main. Branch protection must require these checks
# before a merge is allowed (no green, no merge).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Format check
        run: npm run format
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests + coverage
        run: npm run test:cov --workspace @onestack/api
      - name: Coverage ratchet (coverage may only go up)
        run: npm run coverage:ratchet --workspace @onestack/api

  # Card #5.2 — destructive-migration guard. Blocks DROP/RENAME/TRUNCATE in forward migrations unless
  # the PR carries the `approved-destructive-migration` label.
  migration-guard:
    name: destructive-migration guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Guard
        working-directory: apps/api
        env:
          APPROVED_DESTRUCTIVE: ${{ contains(github.event.pull_request.labels.*.name, 'approved-destructive-migration') }}
        run: npm run check:migrations

  # Card #5.3 — security gates: dependency audit + secret scan + SAST. All blocking.
  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scanning
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency audit (prod deps, high/critical block)
        working-directory: apps/api
        run: npm run audit:ci
      - name: Secret scan (gitleaks)
        run: |
          VER=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner
      - name: SAST (semgrep, ERROR severity blocks)
        run: |
          pip3 install --quiet semgrep
          semgrep scan --config auto --severity ERROR --error --quiet

  # Tenant-isolation + RLS suite against a Supabase TEST project. Enable with repo var
  # SUPABASE_CONFIGURED=true + the secrets below.
  integration:
    name: rls-gate · tenant-isolation
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_CONFIGURED == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Apply schema + RLS (idempotent)
        run: |
          npx prisma db execute --file prisma/sql/0001_init.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0002_rls.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0003_feature_flags.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0004_platform_core.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0005_eventing.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0006_audit_notifications.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0007_line_item.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0008_document.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0009_contact_fields.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0010_quote.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0011_invoice.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0012_split_billing.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0013_work_item_notes_attachments.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0014_scheduling.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0015_lead_capture.sql --schema prisma/schema.prisma
          npx prisma db execute --file prisma/sql/0016_custom_fields.sql --schema prisma/schema.prisma
      - name: RLS gate
        run: npm run check:rls
      - name: Tenant-isolation + integration tests
        run: npm run test:int

  # Card #5.1 — Playwright is the primary E2E/regression framework. Runs the API-level golden flow
  # (skips cleanly if E2E_BASE_URL is unset) and always uploads the trace/report for humans to watch.
  e2e:
    name: playwright golden flow
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      E2E_TENANT_ID: ${{ secrets.E2E_TENANT_ID }}
      E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
        working-directory: .
      - name: Playwright golden flow
        run: npm run test:e2e
      - name: Upload Playwright report + trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/api/playwright-report
          retention-days: 14
